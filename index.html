<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Pokédex 寶可夢圖鑑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap');

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      font-size: 16px;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* 18 種屬性專屬配色 */
    .type-normal   { background: linear-gradient(135deg, #a8a77a, #8a895e); }
    .type-fire     { background: linear-gradient(135deg, #ee8130, #c95d12); }
    .type-water    { background: linear-gradient(135deg, #6390f0, #3b6cd4); }
    .type-electric { background: linear-gradient(135deg, #f7d02c, #d4ac0d); color: #1e293b; }
    .type-grass    { background: linear-gradient(135deg, #7ac74c, #529c27); }
    .type-ice      { background: linear-gradient(135deg, #96d9d6, #5eb8b4); color: #1e293b; }
    .type-fighting { background: linear-gradient(135deg, #c22e28, #941b16); }
    .type-poison   { background: linear-gradient(135deg, #a33ea1, #782376); }
    .type-ground   { background: linear-gradient(135deg, #e2bf65, #b8953d); color: #1e293b; }
    .type-flying   { background: linear-gradient(135deg, #a98ff3, #7c5fd6); }
    .type-psychic  { background: linear-gradient(135deg, #f95587, #c92c5c); }
    .type-bug      { background: linear-gradient(135deg, #a6b91a, #7d8c0d); }
    .type-rock     { background: linear-gradient(135deg, #b6a136, #8c7a20); }
    .type-ghost    { background: linear-gradient(135deg, #735797, #513870); }
    .type-dragon   { background: linear-gradient(135deg, #6f35fc, #4914cc); }
    .type-dark     { background: linear-gradient(135deg, #705746, #4d392c); }
    .type-steel    { background: linear-gradient(135deg, #b7b7ce, #8888a6); color: #1e293b; }
    .type-fairy    { background: linear-gradient(135deg, #d685ad, #b05b85); }
    .type-legendary { background: linear-gradient(135deg, #f59e0b, #d97706, #b45309); }

    /* 自訂捲軸 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    html.dark ::-webkit-scrollbar-track { background: #1e293b; }
    html.dark ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    html:not(.dark) ::-webkit-scrollbar-track { background: #e2e8f0; }
    html:not(.dark) ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    .pokeball-bg {
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.12) 18%, transparent 19%, transparent 26%, rgba(255,255,255,0.08) 27%, rgba(255,255,255,0.08) 65%, transparent 66%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-100 text-slate-900 dark:bg-slate-900 dark:text-slate-50">

  <!-- 頂部導覽列：加大觸控區與文字 -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b-2 border-slate-200 dark:border-slate-800 shadow-md dark:shadow-xl transition-colors">
    <div class="max-w-7xl mx-auto px-3 sm:px-5 py-3 flex flex-col gap-2.5">
      
      <!-- 第一排：大 Logo 與 主題切換 / 重設 / 快取按鈕 -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-3 cursor-pointer active:scale-95 transition" onclick="resetFilters()">
          <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-gradient-to-b from-red-500 to-red-600 border-2 border-slate-800 dark:border-white flex items-center justify-center shadow-lg relative overflow-hidden shrink-0">
            <div class="w-full h-1.5 bg-slate-900 absolute"></div>
            <div class="w-4 h-4 rounded-full bg-white border-2 border-slate-900 z-10"></div>
          </div>
          <div>
            <h1 class="text-xl sm:text-3xl font-black tracking-wide bg-gradient-to-r from-red-600 via-amber-500 to-sky-600 dark:from-red-400 dark:via-amber-300 dark:to-sky-400 bg-clip-text text-transparent">
              寶可夢圖鑑
            </h1>
            <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-bold">點一點卡片看介紹！</p>
          </div>
        </div>

        <!-- 主題切換按鈕、快取狀態與回到全部按鈕 -->
        <div class="flex items-center gap-2">
          <!-- Light / Dark Mode 切換大按鈕 -->
          <button id="themeToggleBtn" onclick="toggleTheme()" aria-label="切換淺色或深色模式"
                  class="min-h-[42px] px-3 py-1.5 rounded-2xl bg-amber-100 hover:bg-amber-200 dark:bg-slate-800 dark:hover:bg-slate-700 active:scale-95 border-2 border-amber-300 dark:border-slate-600 text-sm sm:text-base font-extrabold text-amber-900 dark:text-amber-300 shadow-sm transition flex items-center gap-1.5">
            <span id="themeIcon" class="text-lg">☀️</span>
            <span id="themeLabel" class="hidden sm:inline">淺色模式</span>
          </button>

          <button onclick="resetFilters()" class="min-h-[42px] px-3 py-1.5 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 active:scale-95 border-2 border-slate-300 dark:border-slate-600 text-sm font-extrabold text-slate-700 dark:text-slate-200 transition">
            🔄 重設
          </button>

          <div class="hidden md:flex items-center gap-2 bg-slate-100 dark:bg-slate-800/90 border-2 border-slate-300 dark:border-slate-700 px-3.5 py-2 rounded-2xl text-sm">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 dark:bg-emerald-400"></span>
            <span class="text-slate-700 dark:text-slate-200 font-bold">已存: <strong id="cacheCount" class="text-emerald-600 dark:text-emerald-400">0</strong></span>
            <button onclick="clearAppCache()" title="清除本地快取" class="ml-1 px-2 py-0.5 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-red-600 hover:text-white transition text-xs font-extrabold">
              清除
            </button>
          </div>
        </div>
      </div>

      <!-- 第二排：大搜尋框 與 大世代下拉選單（含「全部」） -->
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <div class="relative sm:col-span-7 flex items-center">
          <svg class="w-6 h-6 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="輸入名字或號碼 (例如: 皮卡丘, 25)"
            class="w-full min-h-[48px] bg-slate-50 dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-600 text-base sm:text-lg font-bold rounded-2xl pl-12 pr-12 py-2 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-red-500 dark:focus:border-amber-400 transition"
          />
          <button id="clearSearchBtn" onclick="clearSearchInput()" class="hidden absolute right-3 w-8 h-8 rounded-full bg-slate-300 dark:bg-slate-600 hover:bg-slate-400 dark:hover:bg-slate-500 text-slate-800 dark:text-white font-bold text-base flex items-center justify-center">
            ✕
          </button>
        </div>

        <div class="sm:col-span-5">
          <select id="genSelect" class="w-full min-h-[48px] bg-slate-50 dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-600 text-base sm:text-lg font-bold rounded-2xl px-4 py-2 text-slate-900 dark:text-white focus:outline-none focus:border-red-500 dark:focus:border-amber-400">
            <option value="1-1025">🌍 全部寶可夢 (#001-#1025)</option>
            <option value="1-151" selected>第1世代：關都 (#001-#151)</option>
            <option value="152-251">第2世代：城都 (#152-#251)</option>
            <option value="252-386">第3世代：豐緣 (#252-#386)</option>
            <option value="387-493">第4世代：神奧 (#387-#493)</option>
            <option value="494-649">第5世代：合眾 (#494-#649)</option>
            <option value="650-721">第6世代：卡洛斯 (#650-#721)</option>
            <option value="722-809">第7世代：阿羅拉 (#722-#809)</option>
            <option value="810-905">第8世代：伽勒爾 (#810-#905)</option>
            <option value="906-1025">第9世代：帕底亞 (#906-#1025)</option>
          </select>
        </div>
      </div>

      <!-- 第三排：自動換行的屬性與「傳說」篩選列（無需左右捲動即可看到全部） -->
      <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 pt-0.5" id="typeFilterBar">
        <button data-type="all" class="type-filter-btn active min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold bg-red-600 text-white shadow-md active:scale-95 transition">
          🌟 全部
        </button>
        <button data-type="legendary" class="type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-amber-900 dark:text-amber-200 bg-amber-100 hover:bg-amber-200 dark:bg-amber-950/70 dark:hover:bg-amber-900/80 border-2 border-amber-400 dark:border-amber-500/70 active:scale-95 transition">
          👑 傳說
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區：大卡片網格 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-5 py-5 pb-24">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
      <p id="statusText" class="text-base sm:text-lg font-extrabold text-slate-700 dark:text-slate-300">載入圖鑑資料中...</p>
      <div id="directSearchHint" class="hidden w-full sm:w-auto">
        <button id="directSearchBtn" class="w-full sm:w-auto min-h-[48px] text-base font-bold bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-5 py-2.5 rounded-2xl shadow-lg transition">
          🔍 直接搜尋這隻寶可夢！
        </button>
      </div>
    </div>

    <!-- 手機 2 欄、平板 3 欄、電腦 4-5 欄 -->
    <div id="pokemonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-5">
      <!-- 動態生成卡片 -->
    </div>
  </main>

  <!-- 右下角懸浮「回到頂部」大按鈕 (Floating Back to Top Button) -->
  <button id="backToTopBtn"
          onclick="scrollToTop()"
          aria-label="回到頂部"
          class="fixed bottom-5 right-5 sm:bottom-7 sm:right-7 z-40 opacity-0 pointer-events-none translate-y-4 transition-all duration-300 min-h-[54px] px-4 sm:px-5 py-3 rounded-full bg-red-600 hover:bg-red-500 dark:bg-amber-500 dark:hover:bg-amber-400 text-white dark:text-slate-950 font-black text-base sm:text-lg shadow-2xl border-2 border-white dark:border-slate-900 flex items-center gap-1.5 active:scale-90">
    <svg class="w-6 h-6 stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
    </svg>
    <span class="hidden sm:inline">回頂部</span>
  </button>

  <!-- 寶可夢詳細資料彈窗 (Modal)：支援 Light & Dark Mode -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden bg-slate-900/75 dark:bg-slate-950/85 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 overflow-y-auto">
    <div class="bg-white dark:bg-slate-900 border-t-2 sm:border-2 border-slate-300 dark:border-slate-700 rounded-t-3xl sm:rounded-3xl w-full max-w-4xl h-[94vh] sm:h-auto sm:max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      
      <!-- Modal 頂部標題與大關閉按鈕 -->
      <div id="modalHeader" class="p-4 sm:p-6 pokeball-bg relative flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
        <button onclick="closeModal()" aria-label="關閉視窗" class="absolute top-3.5 right-3.5 w-12 h-12 rounded-full bg-slate-950/75 hover:bg-slate-950 active:scale-90 text-white text-xl font-black flex items-center justify-center border-2 border-white/30 shadow-lg transition z-20">
          ✕
        </button>

        <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-6 w-full pt-2 sm:pt-0">
          <!-- 大圖片與色違切換大按鈕 -->
          <div class="flex flex-col items-center">
            <div class="w-36 h-36 sm:w-44 sm:h-44 bg-white/25 dark:bg-slate-950/35 rounded-3xl p-2 flex items-center justify-center border-2 border-white/30 shadow-inner">
              <img id="modalArtwork" src="" alt="" class="w-full h-full object-contain drop-shadow-2xl transition-transform duration-300" />
            </div>
            <button id="shinyToggleBtn" onclick="toggleShiny()" class="mt-2.5 min-h-[42px] px-4 py-1.5 rounded-2xl bg-slate-950/80 hover:bg-slate-950 active:scale-95 text-sm font-extrabold text-amber-300 border-2 border-amber-400/60 flex items-center justify-center gap-1.5 shadow transition">
              ✨ 變色版本 (色違)
            </button>
          </div>

          <!-- 名稱、分類與大屬性標籤 -->
          <div class="text-center sm:text-left flex-1">
            <div class="flex items-center justify-center sm:justify-start gap-2 mb-1.5">
              <span id="modalId" class="text-base sm:text-lg font-black px-3 py-0.5 rounded-xl bg-slate-950/60 text-white">#000</span>
              <span id="modalGenera" class="text-sm sm:text-base px-3 py-0.5 rounded-xl bg-white/25 text-white font-bold">---</span>
            </div>
            <h2 id="modalNameZh" class="text-3xl sm:text-4xl font-black text-white tracking-tight drop-shadow">載入中...</h2>
            <p id="modalNameSub" class="text-base sm:text-lg text-white/95 font-bold mt-0.5">English / 日本語</p>

            <!-- 屬性標籤 -->
            <div id="modalTypes" class="flex items-center justify-center sm:justify-start gap-2.5 mt-3"></div>

            <!-- 基礎體型數據 -->
            <div class="grid grid-cols-3 gap-2 mt-4 max-w-md mx-auto sm:mx-0 bg-slate-950/50 rounded-2xl p-3 text-center border border-white/20">
              <div>
                <p class="text-xs sm:text-sm text-white/85 font-bold">身高</p>
                <p id="modalHeight" class="text-base sm:text-lg font-black text-white">-- m</p>
              </div>
              <div class="border-x border-white/20">
                <p class="text-xs sm:text-sm text-white/85 font-bold">體重</p>
                <p id="modalWeight" class="text-base sm:text-lg font-black text-white">-- kg</p>
              </div>
              <div>
                <p class="text-xs sm:text-sm text-white/85 font-bold">經驗值</p>
                <p id="modalBaseExp" class="text-base sm:text-lg font-black text-white">--</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 大分頁導覽 Tabs -->
      <div class="grid grid-cols-4 border-b-2 border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 shrink-0">
        <button onclick="switchTab('overview')" data-tab="overview" class="modal-tab active min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-red-500 dark:border-amber-400 text-red-600 dark:text-amber-300 bg-red-50/70 dark:bg-slate-800/60 transition">
          📖 介紹能力
        </button>
        <button onclick="switchTab('evolution')" data-tab="evolution" class="modal-tab min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
          🧬 進化路線
        </button>
        <button onclick="switchTab('abilities')" data-tab="abilities" class="modal-tab min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
          ⚡ 特殊特性
        </button>
        <button onclick="switchTab('moves')" data-tab="moves" class="modal-tab min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
          ⚔️ 學習招式
        </button>
      </div>

      <!-- 分頁內容區 -->
      <div class="p-4 sm:p-6 overflow-y-auto flex-1 space-y-5 bg-slate-50/60 dark:bg-slate-900" id="modalBody">
        
        <!-- Tab 1: 基本資料、圖鑑描述、種族值與屬性相剋 -->
        <div id="tab-overview" class="tab-content space-y-5">
          <!-- 圖鑑介紹 -->
          <div class="bg-white dark:bg-slate-800/70 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 shadow-sm">
            <h3 class="text-sm sm:text-base font-extrabold text-amber-600 dark:text-amber-300 mb-2">📖 圖鑑小故事</h3>
            <p id="modalFlavorText" class="text-base sm:text-lg text-slate-800 dark:text-white leading-relaxed font-bold">讀取中...</p>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4 pt-4 border-t border-slate-200 dark:border-slate-700 text-sm sm:text-base">
              <div class="bg-slate-100 dark:bg-slate-900/60 p-2.5 rounded-xl"><span class="text-slate-500 dark:text-slate-400 block text-xs font-bold">好抓程度</span><strong id="modalCaptureRate" class="text-slate-900 dark:text-white">--</strong></div>
              <div class="bg-slate-100 dark:bg-slate-900/60 p-2.5 rounded-xl"><span class="text-slate-500 dark:text-slate-400 block text-xs font-bold">初始親密度</span><strong id="modalHappiness" class="text-slate-900 dark:text-white">--</strong></div>
              <div class="bg-slate-100 dark:bg-slate-900/60 p-2.5 rounded-xl"><span class="text-slate-500 dark:text-slate-400 block text-xs font-bold">成長速度</span><strong id="modalGrowthRate" class="text-slate-900 dark:text-white">--</strong></div>
              <div class="bg-slate-100 dark:bg-slate-900/60 p-2.5 rounded-xl"><span class="text-slate-500 dark:text-slate-400 block text-xs font-bold">蛋群分類</span><strong id="modalEggGroups" class="text-slate-900 dark:text-white">--</strong></div>
            </div>
          </div>

          <!-- 六維種族值 -->
          <div class="bg-white dark:bg-slate-800/70 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 shadow-sm">
            <div class="flex items-center justify-between mb-3.5">
              <h3 class="text-sm sm:text-base font-extrabold text-sky-600 dark:text-sky-300">📊 戰鬥能力值</h3>
              <span class="text-sm sm:text-base font-black text-amber-700 dark:text-amber-300 bg-amber-100 dark:bg-slate-900 px-3 py-1 rounded-xl">總和: <span id="modalStatTotal">0</span></span>
            </div>
            <div id="modalStatsContainer" class="space-y-3"></div>
          </div>

          <!-- 屬性防禦相剋分析 -->
          <div class="bg-white dark:bg-slate-800/70 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 shadow-sm">
            <h3 class="text-sm sm:text-base font-extrabold text-rose-600 dark:text-rose-300 mb-3">🛡️ 屬性相剋表（怕什麼屬性？）</h3>
            <div id="modalWeaknessContainer" class="space-y-4 text-sm sm:text-base"></div>
          </div>
        </div>

        <!-- Tab 2: 進化鏈 -->
        <div id="tab-evolution" class="tab-content hidden">
          <div class="bg-white dark:bg-slate-800/70 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-6 shadow-sm">
            <h3 class="text-base sm:text-lg font-extrabold text-emerald-600 dark:text-emerald-300 mb-4 text-center">🧬 進化路線圖（點圖片可以直接切換過去喔！）</h3>
            <div id="evolutionContainer" class="flex flex-wrap items-center justify-center gap-4 min-h-[180px]">
              載入進化鏈中...
            </div>
          </div>
        </div>

        <!-- Tab 3: 特性 -->
        <div id="tab-abilities" class="tab-content hidden space-y-3.5">
          <h3 class="text-base sm:text-lg font-extrabold text-purple-600 dark:text-purple-300">⚡ 這隻寶可夢擁有的特殊能力：</h3>
          <div id="abilitiesContainer" class="space-y-3.5"></div>
        </div>

        <!-- Tab 4: 招式 -->
        <div id="tab-moves" class="tab-content hidden space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <p class="text-sm sm:text-base font-extrabold text-slate-700 dark:text-slate-200">👇 點擊下方任何招式，可以看威力與效果：</p>
            <select id="moveMethodFilter" onchange="renderMovesList()" class="min-h-[46px] bg-white dark:bg-slate-800 border-2 border-slate-300 dark:border-slate-600 text-sm sm:text-base font-bold rounded-xl px-3.5 py-2 text-slate-900 dark:text-white">
              <option value="all">全部學習方式</option>
              <option value="level-up">升級學會 (Level-up)</option>
              <option value="machine">招式學習器 (TM/HM)</option>
              <option value="egg">遺傳蛋招式 (Egg)</option>
            </select>
          </div>

  <script>
    /**
     * ============================================================================
     * 0. Light Mode / Dark Mode 主題切換 & 回到頂部按鈕
     * ============================================================================
     */
    const THEME_KEY = 'pokedex_theme_mode';

    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const isDark = savedTheme ? savedTheme === 'dark' : true;
      applyTheme(isDark);
    }

    function applyTheme(isDark) {
      const htmlEl = document.documentElement;
      const iconEl = document.getElementById('themeIcon');
      const labelEl = document.getElementById('themeLabel');

      if (isDark) {
        htmlEl.classList.add('dark');
        if (iconEl) iconEl.textContent = '🌙';
        if (labelEl) labelEl.textContent = '深色模式';
      } else {
        htmlEl.classList.remove('dark');
        if (iconEl) iconEl.textContent = '☀️';
        if (labelEl) labelEl.textContent = '淺色模式';
      }
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }

    function toggleTheme() {
      const isCurrentlyDark = document.documentElement.classList.contains('dark');
      applyTheme(!isCurrentlyDark);
    }

    function initBackToTop() {
      const btn = document.getElementById('backToTopBtn');
      if (!btn) return;
      window.addEventListener('scroll', () => {
        if (window.scrollY > 320) {
          btn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
          btn.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
        } else {
          btn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
          btn.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
        }
      }, { passive: true });
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    initTheme();

    /**
     * ============================================================================
     * 1. 雙層智慧快取層 (Memory Map + localStorage + 併發去重 In-Flight Deduplication)
     * ============================================================================
     */
    class ApiCache {
      constructor(prefix = 'pokedex_v1_', ttlMs = 1000 * 60 * 60 * 24) {
        this.prefix = prefix;
        this.ttlMs = ttlMs;
        this.memory = new Map();
        this.inFlight = new Map();
        this.updateCounterUI();
      }

      _getStorageKey(url) {
        return this.prefix + url;
      }

      get(url) {
        if (this.memory.has(url)) {
          return this.memory.get(url);
        }
        try {
          const raw = localStorage.getItem(this._getStorageKey(url));
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (Date.now() - parsed.timestamp > this.ttlMs) {
            localStorage.removeItem(this._getStorageKey(url));
            return null;
          }
          this.memory.set(url, parsed.data);
          return parsed.data;
        } catch (e) {
          return null;
        }
      }

      set(url, data) {
        this.memory.set(url, data);
        try {
          const payload = JSON.stringify({ timestamp: Date.now(), data });
          localStorage.setItem(this._getStorageKey(url), payload);
        } catch (e) {
          this._evictOldest();
          try {
            localStorage.setItem(this._getStorageKey(url), JSON.stringify({ timestamp: Date.now(), data }));
          } catch (_) {}
        }
        this.updateCounterUI();
      }

      _evictOldest() {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(this.prefix)) keys.push(k);
        }
        const removeCount = Math.max(1, Math.floor(keys.length * 0.2));
        keys.slice(0, removeCount).forEach(k => localStorage.removeItem(k));
      }

      async fetchJson(url) {
        const cached = this.get(url);
        if (cached) return cached;

        if (this.inFlight.has(url)) {
          return this.inFlight.get(url);
        }

        const promise = fetch(url)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
          })
          .then(data => {
            this.set(url, data);
            this.inFlight.delete(url);
            return data;
          })
          .catch(err => {
            this.inFlight.delete(url);
            throw err;
          });

        this.inFlight.set(url, promise);
        return promise;
      }

      clear() {
        this.memory.clear();
        const toRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(this.prefix)) toRemove.push(k);
        }
        toRemove.forEach(k => localStorage.removeItem(k));
        this.updateCounterUI();
      }

      count() {
        let total = 0;
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(this.prefix)) total++;
        }
        return Math.max(total, this.memory.size);
      }

      updateCounterUI() {
        const el = document.getElementById('cacheCount');
        if (el) el.textContent = this.count();
      }
    }

    const cache = new ApiCache();
    const API_BASE = 'https://pokeapi.co/api/v2';

    /**
     * ============================================================================
     * 2. 常數對照表與多語系輔助函式（含傳說 & 幻之寶可夢全國圖鑑編號）
     * ============================================================================
     */
    const TYPE_ZH = {
      normal: '一般', fire: '火', water: '水', electric: '電', grass: '草', ice: '冰',
      fighting: '格鬥', poison: '毒', ground: '地面', flying: '飛行', psychic: '超能力',
      bug: '蟲', rock: '岩石', ghost: '幽靈', dragon: '龍', dark: '惡', steel: '鋼', fairy: '妖精'
    };

    // 全國圖鑑 #001-#1025 傳說與幻之寶可夢編號集合 (Legendary & Mythical)
    const LEGENDARY_IDS = new Set([
      144, 145, 146, 150, 151,
      243, 244, 245, 249, 250, 251,
      377, 378, 379, 380, 381, 382, 383, 384, 385, 386,
      480, 481, 482, 483, 484, 485, 486, 487, 488, 489, 490, 491, 492, 493,
      494, 638, 639, 640, 641, 642, 643, 644, 645, 646, 647, 648, 649,
      716, 717, 718, 719, 720, 721,
      772, 773, 785, 786, 787, 788, 789, 790, 791, 792, 800, 801, 802, 807, 808, 809,
      888, 889, 890, 891, 892, 893, 894, 895, 896, 897, 898, 905,
      1001, 1002, 1003, 1004, 1007, 1008, 1014, 1015, 1016, 1017, 1024, 1025
    ]);

    const STAT_ZH = {
      hp: '體力 HP',
      attack: '攻擊力',
      defense: '防禦力',
      'special-attack': '特殊攻擊',
      'special-defense': '特殊防禦',
      speed: '速度'
    };

    const DAMAGE_CLASS_ZH = {
      physical: '物理攻擊',
      special: '特殊攻擊',
      status: '變化招式'
    };

    const ZH_NAME_MAP = JSON.parse(localStorage.getItem('pokedex_zh_names') || '{}');

    function saveZhName(id, zhName) {
      if (!zhName || ZH_NAME_MAP[id] === zhName) return;
      ZH_NAME_MAP[id] = zhName;
      try {
        localStorage.setItem('pokedex_zh_names', JSON.stringify(ZH_NAME_MAP));
      } catch (_) {}
    }

    function getLocalizedText(entries, key = 'name', preferLangs = ['zh-hant', 'zh-hans', 'ja', 'en']) {
      if (!Array.isArray(entries)) return '';
      for (const lang of preferLangs) {
        const target = lang.toLowerCase();
        const found = entries.find(e => e.language && e.language.name && e.language.name.toLowerCase() === target);
        if (found && found[key]) return found[key].replace(/\f|\n/g, ' ');
      }
      return '';
    }

    function getArtworkUrl(id, shiny = false) {
      if (shiny) {
        return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/shiny/${id}.png`;
      }
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }

    function extractIdFromUrl(url) {
      const parts = url.replace(/\/$/, '').split('/');
      return parseInt(parts[parts.length - 1], 10);
    }

    /**
     * ============================================================================
     * 3. 應用程式狀態與初始化
     * ============================================================================
     */
    let currentList = [];
    let activeType = 'all';
    let currentModalPokemon = null;
    let isShiny = false;
    let currentTabName = 'overview';
    let renderLimit = 60;

    async function initApp() {
      initTheme();
      initBackToTop();
      initTypeButtons();
      await loadGeneration('1-151');

      document.getElementById('searchInput').addEventListener('input', handleSearchInput);
      document.getElementById('genSelect').addEventListener('change', (e) => {
        activeType = 'all';
        updateTypeButtonStyles();
        loadGeneration(e.target.value);
      });
    }

    function initTypeButtons() {
      const bar = document.getElementById('typeFilterBar');
      Object.entries(TYPE_ZH).forEach(([en, zh]) => {
        const btn = document.createElement('button');
        btn.dataset.type = en;
        btn.className = `type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-slate-700 dark:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 active:scale-95 border-2 border-slate-300 dark:border-slate-600 transition`;
        btn.textContent = zh;
        btn.onclick = () => filterByType(en);
        bar.appendChild(btn);
      });

      bar.querySelector('[data-type="all"]').onclick = () => {
        activeType = 'all';
        updateTypeButtonStyles();
        loadGeneration(document.getElementById('genSelect').value);
      };

      bar.querySelector('[data-type="legendary"]').onclick = () => {
        filterByLegendary();
      };
    }

    function updateTypeButtonStyles() {
      document.querySelectorAll('.type-filter-btn').forEach(btn => {
        const t = btn.dataset.type;
        if (t === activeType) {
          if (t === 'all') {
            btn.className = 'type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-white bg-red-600 shadow-lg ring-2 ring-slate-900 dark:ring-white active:scale-95 transition';
          } else if (t === 'legendary') {
            btn.className = 'type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-white type-legendary shadow-lg ring-2 ring-slate-900 dark:ring-white active:scale-95 transition';
          } else {
            btn.className = `type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-white shadow-lg ring-2 ring-slate-900 dark:ring-white active:scale-95 transition type-${t}`;
          }
        } else {
          if (t === 'legendary') {
            btn.className = 'type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-amber-900 dark:text-amber-200 bg-amber-100 hover:bg-amber-200 dark:bg-amber-950/70 dark:hover:bg-amber-900/80 border-2 border-amber-400 dark:border-amber-500/70 active:scale-95 transition';
          } else {
            btn.className = 'type-filter-btn min-h-[38px] sm:min-h-[40px] px-3 sm:px-3.5 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-slate-700 dark:text-slate-200 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 active:scale-95 border-2 border-slate-300 dark:border-slate-600 transition';
          }
        }
      });
    }

    function clearSearchInput() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderLimit = 60;
      applySearchAndRender();
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('genSelect').value = '1-151';
      activeType = 'all';
      renderLimit = 60;
      updateTypeButtonStyles();
      loadGeneration('1-151');
    }

    function clearAppCache() {
      cache.clear();
      alert('已清除所有本地快取資料！');
    }

    /**
     * ============================================================================
     * 4. 列表載入與篩選（全部世代 / 單一世代 / 18屬性 / 傳說寶可夢）
     * ============================================================================
     */
    async function loadGeneration(rangeStr) {
      const [start, end] = rangeStr.split('-').map(Number);
      const offset = start - 1;
      const limit = end - start + 1;
      renderLimit = 60;

      setStatus(`正在準備 #${String(start).padStart(3, '0')} ~ #${String(end).padStart(3, '0')} 寶可夢...`);
      renderSkeletons(10);

      try {
        const data = await cache.fetchJson(`${API_BASE}/pokemon?offset=${offset}&limit=${limit}`);
        currentList = data.results.map(item => ({
          id: extractIdFromUrl(item.url),
          name: item.name
        }));
        applySearchAndRender();
      } catch (err) {
        setStatus(`載入失敗：${err.message}`);
      }
    }

    async function filterByType(typeName) {
      activeType = typeName;
      renderLimit = 60;
      updateTypeButtonStyles();
      setStatus(`正在尋找【${TYPE_ZH[typeName]}】屬性的寶可夢...`);
      renderSkeletons(10);

      try {
        const typeData = await cache.fetchJson(`${API_BASE}/type/${typeName}`);
        currentList = typeData.pokemon
          .map(p => ({
            id: extractIdFromUrl(p.pokemon.url),
            name: p.pokemon.name
          }))
          .filter(p => p.id <= 1025);

        applySearchAndRender();
      } catch (err) {
        setStatus(`屬性篩選失敗：${err.message}`);
      }
    }

    async function filterByLegendary() {
      activeType = 'legendary';
      renderLimit = 120;
      updateTypeButtonStyles();
      setStatus('正在召喚所有【👑 傳說與幻之寶可夢】...');
      renderSkeletons(10);

      try {
        const allData = await cache.fetchJson(`${API_BASE}/pokemon?offset=0&limit=1025`);
        currentList = allData.results
          .map(item => ({
            id: extractIdFromUrl(item.url),
            name: item.name
          }))
          .filter(p => LEGENDARY_IDS.has(p.id));

        applySearchAndRender();
      } catch (err) {
        setStatus(`傳說篩選失敗：${err.message}`);
      }
    }

    function handleSearchInput() {
      const val = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderLimit = 60;
      applySearchAndRender();
    }

    function showMoreCards() {
      renderLimit += 60;
      applySearchAndRender();
    }

    function applySearchAndRender() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const hintBox = document.getElementById('directSearchHint');

      let filtered = currentList;
      if (keyword) {
        filtered = currentList.filter(p => {
          const idStr = String(p.id);
          const zhName = (ZH_NAME_MAP[p.id] || '').toLowerCase();
          return idStr === keyword || idStr.padStart(3, '0').includes(keyword) || p.name.includes(keyword) || zhName.includes(keyword);
        });
      }

      if (keyword && filtered.length === 0) {
        hintBox.classList.remove('hidden');
        document.getElementById('directSearchBtn').onclick = () => openPokemonDetail(keyword);
      } else {
        hintBox.classList.add('hidden');
      }

      const labelPrefix = activeType === 'legendary' ? '👑 傳說與幻之寶可夢：' : '';
      setStatus(`${labelPrefix}一共有 ${filtered.length} 隻寶可夢`);
      renderPokemonGrid(filtered);
    }

    function setStatus(text) {
      document.getElementById('statusText').textContent = text;
    }

    function renderSkeletons(count) {
      const grid = document.getElementById('pokemonGrid');
      grid.innerHTML = Array.from({ length: count }).map(() => `
        <div class="bg-white dark:bg-slate-800/70 border-2 border-slate-200 dark:border-slate-700/60 rounded-3xl p-4 animate-pulse flex flex-col items-center">
          <div class="w-28 h-28 sm:w-32 sm:h-32 bg-slate-200 dark:bg-slate-700/60 rounded-full mb-3"></div>
          <div class="h-4 w-16 bg-slate-200 dark:bg-slate-700 rounded mb-2"></div>
          <div class="h-6 w-24 bg-slate-200 dark:bg-slate-700 rounded"></div>
        </div>
      `).join('');
    }

    function renderPokemonGrid(list) {
      const grid = document.getElementById('pokemonGrid');
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-14 text-lg font-extrabold text-slate-600 dark:text-slate-300">找不到符合的寶可夢喔，試試看別的名字吧！</div>`;
        return;
      }

      const visibleList = list.slice(0, renderLimit);
      const hasMore = list.length > renderLimit;

      const cardsHtml = visibleList.map(p => {
        const paddedId = `#${String(p.id).padStart(3, '0')}`;
        const zhName = ZH_NAME_MAP[p.id] || '';
        const isLeg = LEGENDARY_IDS.has(p.id);
        return `
          <div onclick="openPokemonDetail(${p.id})"
               data-card-id="${p.id}"
               class="group bg-white hover:bg-slate-50 dark:bg-slate-800/85 dark:hover:bg-slate-800 active:scale-95 border-2 ${isLeg ? 'border-amber-400/80 dark:border-amber-500/70' : 'border-slate-200 dark:border-slate-700'} hover:border-red-500 dark:hover:border-amber-400 rounded-3xl p-4 cursor-pointer transition-all duration-150 shadow-md dark:shadow-lg flex flex-col items-center relative overflow-hidden">
            <div class="w-full flex items-center justify-between">
              ${isLeg ? '<span class="text-xs font-black px-2 py-0.5 rounded-lg bg-amber-100 dark:bg-amber-500/20 text-amber-800 dark:text-amber-300">👑 傳說</span>' : '<span></span>'}
              <span class="text-xs sm:text-sm font-black px-2.5 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-900/80 text-slate-600 dark:text-slate-300">${paddedId}</span>
            </div>
            <div class="w-28 h-28 sm:w-32 sm:h-32 my-1.5 flex items-center justify-center bg-slate-100/70 dark:bg-slate-900/40 rounded-full p-2">
              <img loading="lazy" src="${getArtworkUrl(p.id)}" alt="${p.name}"
                   class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-200 drop-shadow-md"
                   onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'" />
            </div>
            <h3 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white capitalize mt-1.5 text-center card-title leading-snug">
              ${zhName ? `${zhName} <span class="text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 block mt-0.5">${p.name}</span>` : p.name}
            </h3>
            <div class="flex flex-wrap justify-center gap-1.5 mt-2.5 card-types">
              <span class="h-6 w-14 bg-slate-200 dark:bg-slate-700/60 rounded-full"></span>
            </div>
          </div>
        `;
      }).join('');

      const loadMoreHtml = hasMore ? `
        <div class="col-span-full flex justify-center py-6">
          <button onclick="showMoreCards()" class="min-h-[52px] px-8 py-3 rounded-2xl bg-red-600 hover:bg-red-500 active:scale-95 text-white text-base sm:text-lg font-black shadow-lg transition">
            👇 顯示更多寶可夢（還有 ${list.length - renderLimit} 隻）
          </button>
        </div>
      ` : '';

      grid.innerHTML = cardsHtml + loadMoreHtml;
      hydrateVisibleCards(visibleList);
    }

    async function hydrateVisibleCards(list) {
      const batchSize = 12;
      for (let i = 0; i < list.length; i += batchSize) {
        const batch = list.slice(i, i + batchSize);
        await Promise.all(batch.map(async (p) => {
          const card = document.querySelector(`[data-card-id="${p.id}"]`);
          if (!card) return;
          try {
            const [pokeData, speciesData] = await Promise.all([
              cache.fetchJson(`${API_BASE}/pokemon/${p.id}`),
              cache.fetchJson(`${API_BASE}/pokemon-species/${p.id}`).catch(() => null)
            ]);

            const typesEl = card.querySelector('.card-types');
            if (typesEl && pokeData.types) {
              typesEl.innerHTML = pokeData.types.map(t => {
                const tName = t.type.name;
                return `<span class="type-${tName} px-3 py-1 rounded-xl text-xs sm:text-sm font-extrabold text-white shadow">${TYPE_ZH[tName] || tName}</span>`;
              }).join('');
            }

            if (speciesData && speciesData.names) {
              const zh = getLocalizedText(speciesData.names, 'name', ['zh-hant', 'zh-hans']);
              if (zh) {
                saveZhName(p.id, zh);
                const titleEl = card.querySelector('.card-title');
                if (titleEl) {
                  titleEl.innerHTML = `${zh} <span class="text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 block mt-0.5 capitalize">${p.name}</span>`;
                }
              }
            }
          } catch (_) {}
        }));
      }
    }

    /**
     * ============================================================================
     * 5. 寶可夢詳細資料彈窗
     * ============================================================================
     */
    async function openPokemonDetail(idOrName) {
      const modal = document.getElementById('detailModal');
      modal.classList.remove('hidden');
      isShiny = false;
      switchTab('overview');

      document.getElementById('modalNameZh').textContent = '資料讀取中...';
      document.getElementById('modalNameSub').textContent = '';
      document.getElementById('modalTypes').innerHTML = '';

      try {
        const pokemon = await cache.fetchJson(`${API_BASE}/pokemon/${String(idOrName).toLowerCase()}`);
        currentModalPokemon = pokemon;

        const species = await cache.fetchJson(pokemon.species.url).catch(() => null);

        renderModalHeader(pokemon, species);
        renderOverviewTab(pokemon, species);
        renderTypeWeaknesses(pokemon.types);

        if (species && species.evolution_chain) {
          loadEvolutionChain(species.evolution_chain.url);
        } else {
          document.getElementById('evolutionContainer').innerHTML = '<p class="text-base font-bold text-slate-500 dark:text-slate-400">這隻寶可夢沒有進化路線喔</p>';
        }

        loadAbilities(pokemon.abilities);
        renderMovesList();

      } catch (err) {
        document.getElementById('modalNameZh').textContent = '找不到這隻寶可夢';
        document.getElementById('modalNameSub').textContent = `錯誤訊息：${err.message}`;
      }
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function switchTab(tabName) {
      currentTabName = tabName;
      document.querySelectorAll('.modal-tab').forEach(btn => {
        if (btn.dataset.tab === tabName) {
          btn.className = 'modal-tab active min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-red-500 dark:border-amber-400 text-red-600 dark:text-amber-300 bg-red-50/70 dark:bg-slate-800/70 transition';
        } else {
          btn.className = 'modal-tab min-h-[52px] px-2 py-3 text-sm sm:text-base font-extrabold border-b-4 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
        }
      });
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
    }

    function toggleShiny() {
      if (!currentModalPokemon) return;
      isShiny = !isShiny;
      const img = document.getElementById('modalArtwork');
      img.src = getArtworkUrl(currentModalPokemon.id, isShiny);
      const btn = document.getElementById('shinyToggleBtn');
      btn.classList.toggle('bg-amber-500/40', isShiny);
    }

    function renderModalHeader(pokemon, species) {
      const primaryType = pokemon.types[0]?.type.name || 'normal';
      const header = document.getElementById('modalHeader');
      header.className = `p-4 sm:p-6 pokeball-bg relative flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 shrink-0 type-${primaryType}`;

      document.getElementById('modalArtwork').src = getArtworkUrl(pokemon.id, false);
      document.getElementById('modalId').textContent = `#${String(pokemon.id).padStart(3, '0')}`;

      const zhHant = species ? getLocalizedText(species.names, 'name', ['zh-hant', 'zh-hans']) : '';
      if (zhHant) saveZhName(pokemon.id, zhHant);
      const jaName = species ? getLocalizedText(species.names, 'name', ['ja']) : '';
      const enName = species ? getLocalizedText(species.names, 'name', ['en']) : pokemon.name;
      const genera = species ? getLocalizedText(species.genera, 'genus', ['zh-hant', 'zh-hans', 'ja', 'en']) : '寶可夢';

      document.getElementById('modalGenera').textContent = (LEGENDARY_IDS.has(pokemon.id) ? '👑 ' : '') + (genera || '寶可夢');
      document.getElementById('modalNameZh').textContent = zhHant || enName;
      document.getElementById('modalNameSub').textContent = `${enName} ${jaName ? `/ ${jaName}` : ''}`;

      document.getElementById('modalTypes').innerHTML = pokemon.types.map(t => {
        const tn = t.type.name;
        return `<span class="px-4 py-1 rounded-2xl text-sm sm:text-base font-black bg-slate-950/60 text-white border-2 border-white/30 shadow">${TYPE_ZH[tn] || tn}</span>`;
      }).join('');

      document.getElementById('modalHeight').textContent = `${(pokemon.height / 10).toFixed(1)} m`;
      document.getElementById('modalWeight').textContent = `${(pokemon.weight / 10).toFixed(1)} kg`;
      document.getElementById('modalBaseExp').textContent = pokemon.base_experience ?? '--';
    }

    function renderOverviewTab(pokemon, species) {
      const flavor = species
        ? getLocalizedText(species.flavor_text_entries, 'flavor_text', ['zh-hant', 'zh-hans', 'ja', 'en'])
        : '暫無圖鑑描述。';
      document.getElementById('modalFlavorText').textContent = flavor || '暫無圖鑑描述。';

      document.getElementById('modalCaptureRate').textContent = species ? `${species.capture_rate} / 255` : '--';
      document.getElementById('modalHappiness').textContent = species ? species.base_happiness : '--';
      document.getElementById('modalGrowthRate').textContent = species?.growth_rate?.name || '--';
      document.getElementById('modalEggGroups').textContent = species?.egg_groups?.map(g => g.name).join(', ') || '--';

      let total = 0;
      const statsHtml = pokemon.stats.map(s => {
        const val = s.base_stat;
        total += val;
        const pct = Math.min(100, Math.round((val / 255) * 100));
        const barColor = val >= 110 ? 'bg-emerald-500 dark:bg-emerald-400' : val >= 80 ? 'bg-sky-500 dark:bg-sky-400' : val >= 55 ? 'bg-amber-500 dark:bg-amber-400' : 'bg-rose-500 dark:bg-rose-400';
        return `
          <div class="flex items-center gap-3 text-sm sm:text-base">
            <span class="w-24 font-extrabold text-slate-700 dark:text-slate-200 shrink-0">${STAT_ZH[s.stat.name] || s.stat.name}</span>
            <span class="w-10 text-right font-mono font-black text-slate-900 dark:text-white shrink-0">${val}</span>
            <div class="flex-1 h-4 bg-slate-200 dark:bg-slate-950 rounded-full overflow-hidden border border-slate-300 dark:border-slate-700">
              <div class="${barColor} h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('modalStatsContainer').innerHTML = statsHtml;
      document.getElementById('modalStatTotal').textContent = total;
    }

    async function renderTypeWeaknesses(types) {
      const container = document.getElementById('modalWeaknessContainer');
      container.innerHTML = '<span class="text-slate-600 dark:text-slate-300 font-bold">計算屬性相剋中...</span>';

      try {
        const multipliers = {};
        Object.keys(TYPE_ZH).forEach(t => multipliers[t] = 1);

        const typeDetails = await Promise.all(types.map(t => cache.fetchJson(t.type.url)));
        typeDetails.forEach(td => {
          const rel = td.damage_relations;
          rel.double_damage_from.forEach(t => multipliers[t.name] *= 2);
          rel.half_damage_from.forEach(t => multipliers[t.name] *= 0.5);
          rel.no_damage_from.forEach(t => multipliers[t.name] *= 0);
        });

        const weak = Object.entries(multipliers).filter(([, m]) => m > 1).sort((a, b) => b[1] - a[1]);
        const resist = Object.entries(multipliers).filter(([, m]) => m > 0 && m < 1).sort((a, b) => a[1] - b[1]);
        const immune = Object.entries(multipliers).filter(([, m]) => m === 0);

        const renderGroup = (title, items) => `
          <div>
            <span class="text-slate-800 dark:text-slate-200 font-extrabold block mb-2">${title}：</span>
            <div class="flex flex-wrap gap-2">
              ${items.length ? items.map(([t, m]) => `
                <span class="type-${t} px-3.5 py-1.5 rounded-2xl text-white font-extrabold flex items-center gap-1.5 shadow">
                  ${TYPE_ZH[t]} <span class="bg-black/45 px-2 py-0.5 rounded-xl text-xs sm:text-sm">${m}倍</span>
                </span>
              `).join('') : '<span class="text-slate-400">無</span>'}
            </div>
          </div>
        `;

        container.innerHTML =
          renderGroup('⚠️ 弱點（受到加倍傷害）', weak) +
          renderGroup('🛡️ 抗性（受到減半傷害）', resist) +
          (immune.length ? renderGroup('✨ 完全無效（0傷害）', immune) : '');
      } catch (e) {
        container.innerHTML = `<span class="text-rose-500">無法取得屬性相剋資料</span>`;
      }
    }

    /**
     * ============================================================================
     * 6. 進化鏈解析
     * ============================================================================
     */
    async function loadEvolutionChain(url) {
      const container = document.getElementById('evolutionContainer');
      container.innerHTML = '<span class="text-base font-bold text-slate-600 dark:text-slate-300">讀取進化路線中...</span>';

      try {
        const evoData = await cache.fetchJson(url);
        const stages = [];

        function traverse(node, depth = 0) {
          if (!stages[depth]) stages[depth] = [];
          const speciesId = extractIdFromUrl(node.species.url);
          const details = node.evolution_details?.[0];
          let condition = '';
          if (details) {
            if (details.min_level) condition = `等級 ${details.min_level}`;
            else if (details.item) condition = `道具: ${details.item.name}`;
            else if (details.min_happiness) condition = `親密度 ≥ ${details.min_happiness}`;
            else if (details.trigger) condition = details.trigger.name;
          }

          stages[depth].push({ id: speciesId, name: node.species.name, condition });
          if (node.evolves_to && node.evolves_to.length > 0) {
            node.evolves_to.forEach(child => traverse(child, depth + 1));
          }
        }

        traverse(evoData.chain);

        const allEvoNodes = stages.flat();
        await Promise.all(allEvoNodes.map(async (p) => {
          if (!ZH_NAME_MAP[p.id]) {
            const sp = await cache.fetchJson(`${API_BASE}/pokemon-species/${p.id}`).catch(() => null);
            const zh = sp ? getLocalizedText(sp.names, 'name', ['zh-hant', 'zh-hans']) : '';
            if (zh) saveZhName(p.id, zh);
          }
        }));

        container.innerHTML = stages.map((stageList, idx) => `
          ${idx > 0 ? `<div class="text-amber-500 dark:text-amber-400 font-black text-2xl sm:text-3xl px-1">➔</div>` : ''}
          <div class="flex flex-col gap-3">
            ${stageList.map(p => `
              <div onclick="openPokemonDetail(${p.id})"
                   class="bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-800 active:scale-95 border-2 ${p.id === currentModalPokemon.id ? 'border-red-500 dark:border-amber-400 ring-2 ring-red-400/40 dark:ring-amber-400/40' : 'border-slate-300 dark:border-slate-600'} rounded-3xl p-4 flex flex-col items-center cursor-pointer transition min-w-[140px] shadow-md">
                ${p.condition ? `<span class="text-xs sm:text-sm font-extrabold bg-indigo-100 dark:bg-indigo-500/30 text-indigo-700 dark:text-indigo-200 border border-indigo-300 dark:border-indigo-400/50 px-3 py-0.5 rounded-full mb-1.5">${p.condition}</span>` : ''}
                <img src="${getArtworkUrl(p.id)}" class="w-24 h-24 object-contain" />
                <span class="text-base sm:text-lg font-black text-slate-900 dark:text-white mt-1.5 capitalize">${ZH_NAME_MAP[p.id] || p.name}</span>
                ${ZH_NAME_MAP[p.id] ? `<span class="text-xs sm:text-sm font-bold text-slate-500 dark:text-slate-400 capitalize">${p.name}</span>` : ''}
                <span class="text-xs font-bold text-slate-400 dark:text-slate-500 mt-0.5">#${String(p.id).padStart(3, '0')}</span>
              </div>
            `).join('')}
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<span class="text-base text-rose-500">載入進化鏈失敗：${e.message}</span>`;
      }
    }

    /**
     * ============================================================================
     * 7. 特性詳情
     * ============================================================================
     */
    async function loadAbilities(abilities) {
      const container = document.getElementById('abilitiesContainer');
      container.innerHTML = '<p class="text-base font-bold text-slate-600 dark:text-slate-300">載入特性資料中...</p>';

      try {
        const results = await Promise.all(abilities.map(async (item) => {
          const detail = await cache.fetchJson(item.ability.url);
          const zhName = getLocalizedText(detail.names, 'name', ['zh-hant', 'zh-hans', 'ja', 'en']) || item.ability.name;
          const flavor = getLocalizedText(detail.flavor_text_entries, 'flavor_text', ['zh-hant', 'zh-hans', 'ja', 'en']);
          const effect = detail.effect_entries.find(e => e.language.name === 'en')?.short_effect || '';

          return `
            <div class="bg-white dark:bg-slate-800/80 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-4 sm:p-5 shadow-sm">
              <div class="flex flex-wrap items-center gap-2 mb-2">
                <h4 class="text-lg sm:text-xl font-black text-slate-900 dark:text-white">${zhName}</h4>
                <span class="text-sm font-bold text-slate-500 dark:text-slate-400 capitalize">(${item.ability.name})</span>
                ${item.is_hidden ? '<span class="text-xs sm:text-sm font-extrabold px-3 py-0.5 rounded-xl bg-purple-100 dark:bg-purple-500/30 text-purple-700 dark:text-purple-200 border border-purple-300 dark:border-purple-400/50">隱藏特性</span>' : '<span class="text-xs sm:text-sm font-bold px-3 py-0.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200">一般特性</span>'}
              </div>
              <p class="text-base sm:text-lg text-slate-800 dark:text-slate-100 leading-relaxed font-medium">${flavor || effect || '暫無說明'}</p>
            </div>
          `;
        }));

        container.innerHTML = results.join('');
      } catch (e) {
        container.innerHTML = `<p class="text-base text-rose-500">載入特性失敗：${e.message}</p>`;
      }
    }

    /**
     * ============================================================================
     * 8. 招式列表與單一招式查詢
     * ============================================================================
     */
    function renderMovesList() {
      if (!currentModalPokemon) return;
      const methodFilter = document.getElementById('moveMethodFilter').value;
      const container = document.getElementById('movesContainer');
      document.getElementById('moveDetailBox').classList.add('hidden');

      const filteredMoves = currentModalPokemon.moves.filter(m => {
        if (methodFilter === 'all') return true;
        return m.version_group_details.some(v => v.move_learn_method.name === methodFilter);
      });

      if (filteredMoves.length === 0) {
        container.innerHTML = '<p class="col-span-full text-base font-bold text-slate-500 dark:text-slate-400 py-4">這個分類下沒有招式喔</p>';
        return;
      }

      container.innerHTML = filteredMoves.map(m => {
        const latestDetail = m.version_group_details[m.version_group_details.length - 1];
        const lvBadge = latestDetail?.level_learned_at > 0 ? `Lv.${latestDetail.level_learned_at}` : latestDetail?.move_learn_method?.name || '';
        return `
          <button onclick="inspectMove('${m.move.url}')"
                  class="min-h-[52px] flex items-center justify-between bg-white hover:bg-slate-100 dark:bg-slate-800 dark:hover:bg-slate-700 active:scale-95 border-2 border-slate-200 hover:border-red-500 dark:border-slate-600 dark:hover:border-amber-400 rounded-2xl px-4 py-3 text-left transition shadow-sm">
            <span class="text-base font-extrabold text-slate-900 dark:text-white capitalize">${m.move.name.replace('-', ' ')}</span>
            <span class="text-xs sm:text-sm font-extrabold px-2.5 py-1 rounded-xl bg-amber-100 dark:bg-slate-900 text-amber-800 dark:text-amber-300">${lvBadge}</span>
          </button>
        `;
      }).join('');
    }

    async function inspectMove(moveUrl) {
      const box = document.getElementById('moveDetailBox');
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('moveDetailName').textContent = '載入招式資料中...';
      document.getElementById('moveDetailDesc').textContent = '';

      try {
        const move = await cache.fetchJson(moveUrl);
        const zhName = getLocalizedText(move.names, 'name', ['zh-hant', 'zh-hans', 'ja', 'en']) || move.name;
        const desc = getLocalizedText(move.flavor_text_entries, 'flavor_text', ['zh-hant', 'zh-hans', 'ja', 'en']);
        const typeName = move.type.name;
        const dmgClass = move.damage_class.name;

        const typeBadge = document.getElementById('moveDetailType');
        typeBadge.className = `px-3 py-1 rounded-xl text-sm font-extrabold text-white type-${typeName}`;
        typeBadge.textContent = TYPE_ZH[typeName] || typeName;

        document.getElementById('moveDetailName').textContent = `${zhName} (${move.name})`;
        document.getElementById('moveDetailClass').textContent = DAMAGE_CLASS_ZH[dmgClass] || dmgClass;
        document.getElementById('moveDetailPower').textContent = move.power ?? '—';
        document.getElementById('moveDetailAcc').textContent = move.accuracy ? `${move.accuracy}%` : '—';
        document.getElementById('moveDetailPP').textContent = move.pp ?? '—';
        document.getElementById('moveDetailDesc').textContent = desc || move.effect_entries?.[0]?.short_effect || '無詳細說明';
      } catch (e) {
        document.getElementById('moveDetailName').textContent = '招式載入失敗';
      }
    }

    // 啟動應用程式
    initApp();
  </script>
</body>
